; HELLFALL - Config/DefaultGame.ini (REQ-G1-001).
;
; Data/ staging: the runtime reads FPaths::ProjectDir()/Data/*.json (UHellfallTuning). In the editor that
; is the repo's Data/ folder. In a packaged build ProjectDir() is <Staged>/Hellfall/, so Tools/package.ps1
; copies Data/ to exactly that place (next to the staged .uproject) after BuildCookRun. The JSON files are
; deliberately NOT cooked into the pak so Rob can edit a value in the zip and re-run without rebuilding
; (REQ-G1-003 acceptance 3 goes through rebuild; this is a convenience on top).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=7C1A5E3E4B2F4D8A9E6F0B1C2D3E4F5A
ProjectName=HELLFALL
ProjectVersion=0.1.0
CompanyName=RobleusCaesar
Description=First-person horror demo built in Unreal Engine 5.8. Greybox and traversal (gate-0 pipeline build; Gate 1 after approval).

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
