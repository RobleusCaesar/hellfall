; HELLFALL - Config/DefaultEngine.ini (REQ-G1-001). Hand-authored; every non-default explained.
;
; RENDERING DECISION (G-7 fallback, recorded in BUILD.md and Docs/audit/environment-2026-09-05.md):
; the only machine available on 2026-09-05 is a Ryzen 7 7730U laptop with an integrated Vega-class
; Radeon iGPU (512 MB dedicated VRAM, shared memory, 1920x1080@60). UE 5.8 Lumen needs RTX 2000+ /
; RX 6000+ / Arc and Nanite needs SM6.6 atomics at a cost this GPU cannot pay at 60 fps. Therefore:
;   - no Lumen (GI method 0 = None, reflections 0 = None), no Nanite, no Virtual Shadow Maps
;   - static/baked lighting path (r.AllowStaticLighting=True) with classic shadow maps
;   - DX12 default RHI targeting SM6 only (the D3D12 list holds just PCD3D_SM6); SM5 exists only for the D3D11 RHI fallback
;   - TAA (method 2), not TSR; motion blur, lens flare and auto exposure off (deterministic greybox review)
; If Rob's real review machine has a discrete GPU this block is revisited before Gate 3, not before.
;
; AndroidFileServer: the editor appended an [/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings] block (with a SecurityToken) to this file on every launch; the plugin is disabled in Hellfall.uproject (Windows-only project, G-6) so the editor stops writing it. If the block reappears, delete it and check the .uproject entry - never commit it.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_ExecutiveFloor.L_ExecutiveFloor
GameDefaultMap=/Game/Maps/L_ExecutiveFloor.L_ExecutiveFloor
GlobalDefaultGameMode=/Script/Hellfall.HellfallGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.RendererSettings]
; Lumen off (iGPU fallback, see header)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Lumen.TraceMeshSDFs=0
; Nanite / VSM off
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
; Baked lighting path
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=False
; Anti-aliasing: 2 = TAA (TSR is too costly on this GPU)
r.AntiAliasingMethod=2
; Deterministic look for greybox review: no motion blur, fixed exposure, no lens flare
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=True
; gate-1 finding 2026-09-06: with a FIXED exposure the greybox brightness scaled with fill-light overlap (single-light rooms fine, 2-3 light corridors white); auto exposure (histogram) normalises every room for review. Bias 0.
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LensFlare=False
; Skin cache shaders: required later for skeletal meshes (Gate 4 demons); enabling now avoids a
; full shader recompile when the first skeletal mesh is imported.
r.SkinCache.CompileShaders=True
r.RayTracing=False

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.Engine]
; no changes

[/Script/Engine.CollisionProfile]
; engine defaults (Pawn / WorldStatic profiles are all the greybox needs; REQ-G1-007 uses simple box collision)

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Developer mode writes the unreal.py stub so Tools/ue/*.py get completion; harmless in packaged builds.
bDeveloperMode=True
